<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Marka Renk Geçişi (Sitenizdeki Turkuaz/Cyan tonları) -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    
    <!-- Lazer Çizgisi Renk Geçişi (Kenarlara doğru kaybolan efekt) -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="15%" stop-color="#2dd4bf" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="1"/>
      <stop offset="85%" stop-color="#2dd4bf" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>

    <!-- Lazer Parlama (Glow) Efekti -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Tarayıcı / Kamera Köşeleri (Viewfinder) -->
  <path d="M 40 72 L 40 40 L 72 40" fill="none" stroke="url(#brandGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 184 40 L 216 40 L 216 72" fill="none" stroke="url(#brandGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 40 184 L 40 216 L 72 216" fill="none" stroke="url(#brandGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 184 216 L 216 216 L 216 184" fill="none" stroke="url(#brandGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- OPTİK FORM ŞIKLARI (A - B - C) -->
  
  <!-- 1. Satır -->
  <circle cx="84" cy="84" r="14" fill="none" stroke="#475569" stroke-width="6"/>
  <!-- İşaretli Şık -->
  <circle cx="128" cy="84" r="14" fill="url(#brandGrad)"/>
  <circle cx="172" cy="84" r="14" fill="none" stroke="#475569" stroke-width="6"/>

  <!-- 2. Satır (Lazerin tam üstünden geçtiği satır) -->
  <circle cx="84" cy="128" r="14" fill="none" stroke="#475569" stroke-width="6"/>
  <circle cx="128" cy="128" r="14" fill="none" stroke="#475569" stroke-width="6"/>
  <!-- İşaretli Şık -->
  <circle cx="172" cy="128" r="14" fill="url(#brandGrad)"/>

  <!-- 3. Satır -->
  <!-- İşaretli Şık -->
  <circle cx="84" cy="172" r="14" fill="url(#brandGrad)"/>
  <circle cx="128" cy="172" r="14" fill="none" stroke="#475569" stroke-width="6"/>
  <circle cx="172" cy="172" r="14" fill="none" stroke="#475569" stroke-width="6"/>

  <!-- OPTİK OKUYUCU LAZERİ (2. Satırı tararken) -->
  <rect x="20" y="126" width="216" height="4" fill="url(#laserGrad)" filter="url(#glow)" opacity="0.9"/>
</svg>
